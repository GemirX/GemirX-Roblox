<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Game Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080b10; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* Üst Menü */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #111827; padding: 15px 20px; border-radius: 10px; border: 1px solid #1f293d; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: bold; color: #00f3ff; text-shadow: 0 0 8px rgba(0,243,255,0.4); }
        .user-stats { display: flex; align-items: center; gap: 15px; }
        .pts-badge { background: #00f3ff1a; color: #00f3ff; border: 1px solid #00f3ff; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #1f293d; color: #9ca3af; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: #00f3ff; color: #000; }
        
        /* Sekme İçerikleri */
        .tab-content { display: none; background: #111827; padding: 20px; border-radius: 10px; border: 1px solid #1f293d; }
        .tab-content.active { display: block; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #00f3ff; }
        
        /* Oyun Kartları */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .game-card { background: #1a2332; border: 1px solid #2d3748; padding: 15px; border-radius: 8px; text-align: center; }
        .game-card h3 { margin-bottom: 10px; font-size: 16px; }
        .game-card p { font-size: 13px; color: #a0aec0; margin-bottom: 15px; }
        
        /* Form Elemanları ve Butonlar */
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: #080b10; border: 1px solid #2d3748; color: #fff; border-radius: 5px; outline: none; }
        .play-btn { width: 100%; padding: 10px; background: #00f3ff; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .play-btn:hover { opacity: 0.9; }
        .card-form { background: #1a2332; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2d3748; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="navbar">
            <div class="logo">CYBERHUB</div>
            <div class="user-stats">
                <div class="pts-badge"><span id="userPoints">0</span> PTS</div>
                <div id="displayUsername" style="font-weight: bold;">Giriş Yapılmadı</div>
            </div>
        </div>

        <!-- NAVIGASYON -->
        <div class="nav-links">
            <button class="nav-btn active" onclick="showTab('tab-games')">🎮 OYUNLAR</button>
            <button class="nav-btn" onclick="showTab('tab-shop')">🎁 MAĞAZA</button>
            <button class="nav-btn" onclick="showTab('tab-admin')">⚡ ADMIN</button>
            <button class="nav-btn" onclick="showTab('tab-auth')">🔑 HESAP</button>
        </div>

        <!-- OYUNLAR -->
        <div id="tab-games" class="tab-content active">
            <div class="section-title">MEVCUT OYUNLAR</div>
            <div class="games-grid">
                <div class="game-card">
                    <h3>NEON CLICKER</h3>
                    <p>Tıkladıkça puan kazan.</p>
                    <button class="play-btn" id="btnClicker">+1 PUAN AL</button>
                </div>
            </div>
        </div>

        <!-- MAĞAZA -->
        <div id="tab-shop" class="tab-content">
            <div class="section-title">SİTE MAĞAZASI</div>
            <div class="games-grid">
                <div class="game-card">
                    <h3>SAYI TAHMİN OYUNU</h3>
                    <p>500 PTS ile kalıcı olarak aç.</p>
                    <button class="play-btn">500 PTS İLE AÇ</button>
                </div>
            </div>
        </div>

        <!-- ADMIN PANELİ -->
        <div id="tab-admin" class="tab-content">
            <div class="section-title" style="color: #ff003c;">YÖNETİCİ KONTROL PANELİ</div>
            <div class="card-form">
                <h3>Oyuncuya Puan Ekle / Çıkar</h3>
                <input type="text" id="admTargetUser" placeholder="Kullanıcı Adı veya E-Posta">
                <input type="number" id="admScoreAmount" placeholder="Miktar (Örn: 5000)">
                <button class="play-btn" id="btnAdmUpdateScore">PUANI GÜNCELLE</button>
            </div>
        </div>

        <!-- KAYIT & GİRİŞ -->
        <div id="tab-auth" class="tab-content">
            <div class="section-title">GİRİŞ YAP / KAYIT OL</div>
            <div class="card-form">
                <input type="text" id="authUsername" placeholder="Kullanıcı Adı (Sadece Kayıtta)">
                <input type="email" id="authEmail" placeholder="E-Posta Adresi">
                <input type="password" id="authPassword" placeholder="Şifre">
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="play-btn" id="btnLogin">GİRİŞ YAP</button>
                    <button class="play-btn" id="btnRegister" style="background:#10b981; color:#fff;">KAYIT OL</button>
                </div>
                <div id="authMsg" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Yapılandırman
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "gemirx.roblox.1717@gmail.com";
        let currentUserData = null;

        // Oturum Durumu Takibi
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    document.getElementById('userPoints').innerText = currentUserData.score || 0;
                    document.getElementById('displayUsername').innerText = currentUserData.username || user.email;
                }
            } else {
                document.getElementById('userPoints').innerText = "0";
                document.getElementById('displayUsername').innerText = "Giriş Yapılmadı";
            }
        });

        // BENZERSIZ ISIM KONTROLLÜ KAYIT
        document.getElementById('btnRegister').onclick = async () => {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            const username = document.getElementById('authUsername').value.trim();
            const msg = document.getElementById('authMsg');

            if(!email || !pass || !username) {
                msg.innerText = "Lütfen tüm alanları doldurun!";
                msg.style.color = "red";
                return;
            }

            try {
                // 1. Kullanıcı adı benzersiz mi kontrol et
                const q = query(collection(db, "users"), where("username", "==", username));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    msg.innerText = "Hata: Bu kullanıcı adı başkası tarafından alınmış!";
                    msg.style.color = "red";
                    return;
                }

                // 2. Hesabı oluştur
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: username });

                // 3. Firestore kaydını yap
                await setDoc(doc(db, "users", res.user.uid), {
                    username: username,
                    email: email,
                    score: 0,
                    isAdmin: email === ADMIN_EMAIL
                });

                msg.innerText = "Kayıt Başarılı!";
                msg.style.color = "#10b981";
            } catch (err) {
                msg.innerText = "Hata: " + err.message;
                msg.style.color = "red";
            }
        };

        // GİRİŞ YAPMA
        document.getElementById('btnLogin').onclick = async () => {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            const msg = document.getElementById('authMsg');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                msg.innerText = "Giriş Başarılı!";
                msg.style.color = "#10b981";
            } catch (err) {
                msg.innerText = "Hata: " + err.message;
                msg.style.color = "red";
            }
        };

        // TIKLAMA OYUNU (PUAN ARTIRMA)
        document.getElementById('btnClicker').onclick = async () => {
            if(!auth.currentUser) return alert("Önce giriş yapmalısınız!");
            
            const userRef = doc(db, "users", auth.currentUser.uid);
            const userSnap = await getDoc(userRef);
            
            if(userSnap.exists()){
                const newScore = (userSnap.data().score || 0) + 1;
                await setDoc(userRef, { score: newScore }, { merge: true });
                document.getElementById('userPoints').innerText = newScore;
            }
        };

        // ADMIN PANELİ PUAN GÜNCELLEME
        document.getElementById('btnAdmUpdateScore').onclick = async () => {
            const targetInput = document.getElementById('admTargetUser').value.trim();
            const amount = parseInt(document.getElementById('admScoreAmount').value);

            if (!targetInput || isNaN(amount)) return alert("Geçerli isim/e-posta ve miktar girin!");

            // İsme göre ara
            let q = query(collection(db, "users"), where("username", "==", targetInput));
            let snap = await getDocs(q);

            // Bulunamazsa e-postaya göre ara
            if (snap.empty) {
                q = query(collection(db, "users"), where("email", "==", targetInput));
                snap = await getDocs(q);
            }

            if (snap.empty) {
                alert("Kullanıcı bulunamadı!");
                return;
            }

            snap.forEach(async (docSnap) => {
                const currentScore = docSnap.data().score || 0;
                await setDoc(doc(db, "users", docSnap.id), { score: currentScore + amount }, { merge: true });
                alert(`İşlem başarılı! Yeni Puan: ${currentScore + amount}`);
            });
        };
    </script>

    <!-- TAB GEÇİŞ SCRIPT -->
    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
