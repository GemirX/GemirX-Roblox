<!DOCTYPE html>
<html>
<head>
    <title>GemirX Roblox</title>
</head>
<body style="background-image: url('logo.png'); background-size: cover; background-position: center; background-attachment: fixed; font-family: Arial, sans-serif; text-align: center; color: white; margin: 0; padding: 0;">

    <!-- Dark Overlay -->
    <div style="background-color: rgba(0, 0, 0, 0.6); min-height: 100vh; padding-top: 40px; box-sizing: border-box;">

        <!-- Main Title -->
        <h1 style="font-size: 36px; background-color: #000000; display: inline-block; padding: 10px 20px; border-radius: 8px; border: 2px solid #00a2ff;">
            GEMIRX ROBLOX FAVORITE GAMES
        </h1>

        <p style="font-size: 16px; margin-top: 15px; color: #ddd;">
            Click the red button to visit Roblox.com
        </p>

        <!-- Games List -->
        <div style="background-color: rgba(0, 0, 0, 0.8); width: 340px; margin: 25px auto; padding: 20px; border-radius: 12px; text-align: left; border: 1px solid #333;">
            <h3 style="margin-top: 0; color: #00a2ff; text-align: center;">Most Played Games:</h3>
            <ul style="list-style-type: square; padding-left: 20px; font-size: 18px; line-height: 2;">
                <li>Blox Fruits</li>
                <li>The Strongest Battleground</li>
                <li>Evade</li>
            </ul>
        </div>

        <!-- Button -->
        <a href="https://www.roblox.com" target="_blank" style="text-decoration: none;">
            <button style="background-color: #e2231a; color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">
                Go to Roblox.com
            </button>
        </a>

    </div>

</body>
</html>
